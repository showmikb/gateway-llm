name: release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build the Go binary for linux/{amd64,arm64}. We build in a matrix so
  # every architecture gets its own SLSA provenance.
  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    outputs:
      digest-amd64: ${{ steps.hash.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.hash.outputs.digest-arm64 }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -buildvcs=true \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o ../dist/gateway-llm-linux-${{ matrix.arch }} \
            ./cmd/gateway-llm

      - name: Hash binary
        id: hash
        working-directory: .
        run: |
          sha256sum dist/gateway-llm-linux-${{ matrix.arch }} > dist/gateway-llm-linux-${{ matrix.arch }}.sha256
          echo "digest-${{ matrix.arch }}=$(awk '{print $1}' dist/gateway-llm-linux-${{ matrix.arch }}.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateway-llm-${{ matrix.arch }}
          path: dist/

  # SBOM for the Go module. Uses anchore/sbom-action which produces
  # SPDX and CycloneDX in one call.
  sbom:
    name: sbom
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: ./backend
          artifact-name: gateway-llm.spdx.json
          format: spdx-json
      - uses: anchore/sbom-action@v0
        with:
          path: ./backend
          artifact-name: gateway-llm.cdx.json
          format: cyclonedx-json

  # SLSA v1 Level 3 provenance for the Go binary.
  provenance:
    needs: build
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build.outputs.digest-amd64 }} ${{ needs.build.outputs.digest-arm64 }}"
      upload-assets: true

  # Build and push multi-arch container image, then sign with cosign and
  # attest the SBOM as an OCI referrer.
  image:
    name: container-image
    runs-on: ubuntu-latest
    needs: [build, sbom]
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Keyless sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            cosign sign --yes "${tag}@${DIGEST}"
          done
