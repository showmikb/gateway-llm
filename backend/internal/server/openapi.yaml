            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: object

  /v1/management/providers/discover:
    post:
      summary: Discover models
      description: Uses a stored credential to list available models from the provider
      tags: [Discovery]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential_id]
              properties:
                credential_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Discovered models
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataWrapper'
        '502':
          description: Provider discovery failed

  /v1/management/routes/sync:
    post:
      summary: Sync routes
      description: Auto-create deployments from a credential for selected models
      tags: [Discovery]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential_id, models]
              properties:
                credential_id:
                  type: string
                  format: uuid
                org_id:
                  type: string
                  format: uuid
                models:
                  type: array
                  items:
                    type: string
                skip_existing:
                  type: boolean
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: integer
                  skipped:
                    type: integer
                  routes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Deployment'
