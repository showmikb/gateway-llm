server:
  port: 8080
  read_timeout: 30s
  write_timeout: 120s
  graceful_shutdown_timeout: 30s

database:
  url: ${DATABASE_URL}
  max_connections: 25

redis:
  url: ${REDIS_URL}

auth:
  master_key: ${GATEWAY_LLM_MASTER_KEY}

model_list:
  - model_alias: "gpt-4o"
    deployments:
      - provider: openai
        model: gpt-4o
        api_key_env: OPENAI_API_KEY

  - model_alias: "gpt-4o-mini"
    deployments:
      - provider: openai
        model: gpt-4o-mini
        api_key_env: OPENAI_API_KEY

  - model_alias: "claude-sonnet"
    deployments:
      - provider: anthropic
        model: claude-sonnet-4-20250514
        api_key_env: ANTHROPIC_API_KEY

  - model_alias: "gemini-flash"
    deployments:
      - provider: gemini
        model: gemini-2.0-flash
        api_key_env: GEMINI_API_KEY

  - model_alias: "smart"
    deployments:
      - provider: openai
        model: gpt-4o
        api_key_env: OPENAI_API_KEY
      - provider: anthropic
        model: claude-sonnet-4-20250514
        api_key_env: ANTHROPIC_API_KEY
      - provider: gemini
        model: gemini-2.0-flash
        api_key_env: GEMINI_API_KEY

  - model_alias: "text-embedding-3-small"
    deployments:
      - provider: openai
        model: text-embedding-3-small
        api_key_env: OPENAI_API_KEY

  - model_alias: "dall-e-3"
    deployments:
      - provider: openai
        model: dall-e-3
        api_key_env: OPENAI_API_KEY

  - model_alias: "tts-1"
    deployments:
      - provider: openai
        model: tts-1
        api_key_env: OPENAI_API_KEY

  - model_alias: "whisper-1"
    deployments:
      - provider: openai
        model: whisper-1
        api_key_env: OPENAI_API_KEY

routing:
  strategy: round-robin
  retries: 2
  retry_delay: 500ms
  fallback_enabled: true

rate_limiting:
  default_rpm: 60
  default_tpm: 100000
  window: 1m

logging:
  level: info
  format: json

# Exact-match LLM response cache (deterministic, non-streaming requests).
# response_cache:
#   enabled: true
#   ttl: 10m
#   similarity_min: 0.92  # reserved for the semantic tier below

# Content-safety guardrails evaluated pre-request / post-response.
# guardrails:
#   enabled: true
#   redact_pii: true
#   block_prompt_injection: true
#   blocked_patterns:
#     - "(?i)internal-only"

# SmartRoute autonomous cost-quality optimizer. Populate `tiers` to map
# the classifier's (simple|medium|complex) bucket to a cheaper/premier
# alias. Enable shadow_percent to compare a challenger alongside the
# primary for a fraction of requests.
# smart_route:
#   enabled: true
#   tiers:
#     simple: gpt-4o-mini
#     medium: gpt-4o-mini
#     complex: gpt-4o
#   shadow_percent: 0
#   shadow_challenger: ""
#   shadow_max_concurrent: 4
#   ml_model_path: ""       # point at a file produced by `gateway-llm train`

# Semantic (cosine-similarity) response cache. The default HashEmbedder
# is zero-dependency but weaker than a real embedding model; swap in
# server bootstrap when you have a production embedder.
# semantic_cache:
#   enabled: true
#   similarity_min: 0.92
#   max_entries: 256
#   ttl: 30m
#   dim: 256

# Pre/post request plugin pipeline. Each entry must be registered by
# name via plugins.Register() at init() time, or the path must point at
# a Go plugin .so file (Linux/macOS only, exact toolchain match).
# plugins:
#   enabled: true
#   list:
#     - name: audit-stamper
#       options: {}

# Observability callbacks (uncomment to enable)
# callbacks:
#   - type: otel
#     endpoint: "http://otel-collector:4318"
#     service_name: gateway-llm
#     headers:
#       Authorization: "Bearer ${OTEL_TOKEN}"
#
