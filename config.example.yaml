#     site: datadoghq.com
#
#   - type: langsmith
#     api_key_env: LANGSMITH_API_KEY
#     project: "gateway-llm-prod"
#
#   - type: arize
#     api_key_env: ARIZE_API_KEY
#     space_key_env: ARIZE_SPACE_KEY
#     model_id: gateway-llm
#
#   - type: webhook
#     endpoint: "https://my-mlflow.example.com/api/2.0/mlflow/gateway/log"
#     method: POST
